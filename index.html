<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תזרים משק בית וינר · ינואר–יולי 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#d4ff26;--ink:#0a0a0a;--blue:#b8ddff;--pink:#ffc9de;--lemon:#fff3a3;
  --white:#fff;--mint:#b7f5d5;--lilac:#ded0ff;--peach:#ffd9b8;--marker:#ffe24a;
  --grey:#e8e8e8;--sand:#f4ecd2;--aqua:#c9eef2;
  --bd:4px;--sh:-7px 7px 0 var(--ink);--shs:-4px 4px 0 var(--ink);--r:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--lime);font-family:"Heebo",system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:"Rubik",sans-serif;margin:0;letter-spacing:-.02em}
.num{font-family:"Rubik",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}



.doodles{position:fixed;inset:0;pointer-events:none;z-index:0}
.doodles svg{position:absolute}
@media (max-width:1200px){.doodles{display:none}}
.wrap{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:22px 26px 60px}

.card{background:var(--white);border:var(--bd) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--sh);padding:20px;position:relative}
.tag{display:inline-block;font-family:"Rubik";font-weight:800;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;border:3px solid var(--ink);border-radius:99px;padding:4px 11px;
  background:var(--white);box-shadow:-3px 3px 0 var(--ink)}

/* topbar */
.topwrap{position:sticky;top:0;z-index:30;background:var(--lime);
  margin:-22px -26px 12px;padding:16px 26px 12px}
.topbar{background:var(--white);border:var(--bd) solid var(--ink);
  border-radius:var(--r);box-shadow:var(--sh);padding:11px 15px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;
  text-align:start;cursor:pointer}
.brand .mk{width:44px;height:44px;border:var(--bd) solid var(--ink);border-radius:14px;background:var(--lemon);
  color:var(--ink);display:grid;place-items:center;box-shadow:-3px 3px 0 var(--ink);transform:rotate(-4deg);
  transition:transform .14s,background .14s}
.brand:hover .mk{transform:rotate(-4deg) translate(2px,-2px)}
.brand.on .mk{background:var(--ink);color:var(--lime)}
.brand h1{font-size:18px;font-weight:900;line-height:1}
.brand p{margin:3px 0 0;font-size:11px;font-weight:700;opacity:.6}
.search{flex:1 1 190px;min-width:170px;display:flex;align-items:center;gap:8px;border:var(--bd) solid var(--ink);
  border-radius:99px;background:var(--blue);padding:7px 14px;box-shadow:var(--shs)}
.search input{border:0;background:transparent;outline:none;width:100%;font-family:"Heebo";font-size:14px;font-weight:600}
.search input::placeholder{color:#0a0a0a;opacity:.45}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{font-family:"Rubik";font-weight:800;font-size:13.5px;border:var(--bd) solid var(--ink);border-radius:99px;
  padding:8px 16px;background:var(--white);box-shadow:-3px 3px 0 var(--ink);cursor:pointer;
  transition:transform .12s,box-shadow .12s}
.tab:hover{transform:translate(2px,-2px);box-shadow:-5px 5px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--lime)}
.who{display:flex}
.who button{width:40px;height:40px;border:var(--bd) solid var(--ink);border-radius:50%;font-family:"Rubik";
  font-weight:900;font-size:15px;margin-inline-start:-9px;box-shadow:-2px 2px 0 var(--ink);cursor:pointer;
  transition:transform .12s}
.who button:hover{transform:translateY(-3px)}
.who button.sel{background:var(--ink)!important;color:var(--lime)}

/* info button + drawer */
.i{width:26px;height:26px;flex:none;border:3px solid var(--ink);border-radius:50%;background:var(--white);
  font-family:"Rubik";font-weight:900;font-size:13px;line-height:1;cursor:pointer;box-shadow:-2px 2px 0 var(--ink);
  display:grid;place-items:center;padding:0;transition:transform .12s,background .12s}
.i:hover{background:var(--marker);transform:translate(2px,-2px)}
.pop{position:fixed;z-index:80;width:min(360px,92vw);background:var(--lemon);
  border:var(--bd) solid var(--ink);border-radius:18px;box-shadow:-8px 8px 0 var(--ink);
  padding:15px 17px;opacity:0;visibility:hidden;transform:translateY(6px);
  transition:opacity .13s,transform .13s;pointer-events:none}
.pop.on{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.pop h4{font-size:16px;font-weight:900;margin-bottom:8px}
.pop .plead{font-family:"Rubik";font-weight:900;font-size:14px;line-height:1.5;
  background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.pop .pb{font-size:13.5px;font-weight:600;line-height:1.58;white-space:pre-wrap;
  max-height:min(46vh,340px);overflow-y:auto;overscroll-behavior:contain}
@media (hover:none){
  .pop{inset-inline:10px auto;width:calc(100vw - 20px);top:auto!important;bottom:12px!important;left:10px!important}
}
@media (prefers-reduced-motion:reduce){.pop{transition:none}}

/* panels */
.panel{display:none}
.panel.on{display:grid;gap:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:21px;font-weight:900}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stat{border:var(--bd) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
.stat .lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-family:"Rubik";font-weight:800;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.big{font-family:"Rubik";font-weight:900;font-size:clamp(30px,4vw,48px);line-height:1;margin-top:12px;
  display:inline-block;position:relative}
.big .cur{font-size:.45em;font-weight:800;opacity:.5;margin-inline-start:4px}
.hl{position:relative;display:inline-block}
.hl svg{position:absolute;inset-inline-start:-6px;bottom:-8px;width:calc(100% + 14px);height:15px}
.sub{margin:12px 0 0;font-size:12.5px;font-weight:700;opacity:.7}

/* verdict band */
.verdict{padding:0;overflow:hidden}
.vtop{display:flex;flex-wrap:wrap}
.vcell{flex:1 1 210px;min-width:0;padding:17px 18px;display:flex;flex-direction:column;
  gap:10px;justify-content:center;border-inline-start:var(--bd) solid var(--ink)}
.vcell:first-child{border-inline-start:0}
.vlbl{display:flex;align-items:center;gap:7px;font-family:"Rubik";font-weight:800;font-size:12px;
  letter-spacing:.05em;opacity:.75;white-space:nowrap}
.vnum{display:flex;align-items:baseline;gap:4px;font-family:"Rubik";font-weight:900;
  font-size:clamp(27px,2.9vw,40px);line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.vnum .cur{font-size:.44em;font-weight:800;opacity:.5}
.vstat{display:flex;flex-wrap:wrap;gap:8px 18px;padding:11px 22px;background:var(--mint);
  border-top:var(--bd) solid var(--ink);font-size:12.5px;font-weight:800}
.vstat span{display:flex;align-items:center;gap:7px}
.vstat .warn{background:var(--marker);border:3px solid var(--ink);border-radius:99px;padding:2px 10px}
.foot-note{margin:14px 0 0;font-size:12.5px;font-weight:700;opacity:.78;border-top:3px dashed var(--ink);padding-top:11px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1050px){
  .vcell{flex:1 1 46%;border-top:var(--bd) solid var(--ink)}
  .vcell:nth-child(-n+2){border-top:0}
  .vcell:nth-child(odd){border-inline-start:0}
}
@media (max-width:400px){
  .vcell{flex:1 1 100%;border-inline-start:0;border-top:var(--bd) solid var(--ink)}
  .vcell:first-child{border-top:0}
}

/* the map — how you get in */
.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mapc{display:flex;flex-direction:column;gap:9px;text-align:start;cursor:pointer;
  border:var(--bd) solid var(--ink);border-radius:20px;box-shadow:var(--sh);padding:16px 18px;
  transition:transform .14s,box-shadow .14s}
.mapc:hover{transform:translate(3px,-3px);box-shadow:-11px 11px 0 var(--ink)}
.mapc:active{transform:translate(-3px,3px);box-shadow:-2px 2px 0 var(--ink)}
.mq{font-size:13px;font-weight:800;line-height:1.35;opacity:.8}
.mn{display:flex;align-items:baseline;gap:5px;font-family:"Rubik";font-weight:900;font-size:31px;
  line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.mn .cur{font-size:.42em;font-weight:800;opacity:.5}
.md{display:flex;align-items:center;gap:7px;font-family:"Rubik";font-weight:800;font-size:12px;
  border-top:3px dashed var(--ink);padding-top:9px;margin-top:auto}
.md b{margin-inline-start:auto;font-size:15px}
@media (max-width:1050px){.mapgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.mapgrid{grid-template-columns:1fr}}

/* account filter */
.accbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--marker);
  border:var(--bd) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);
  padding:13px 18px;margin-top:12px}
.accbar .ttl{font-family:"Rubik";font-weight:900;font-size:16px;display:flex;align-items:center;gap:9px}
.accbar .ttl i{width:17px;height:17px;border:3px solid var(--ink);border-radius:5px;flex:none}
.accbar .warn{font-size:12.5px;font-weight:700;flex:1;min-width:220px;line-height:1.4}
.neutral-wrap{margin-bottom:16px}
.neutral{display:flex;align-items:center;gap:11px;background:var(--grey);border:var(--bd) solid var(--ink);
  border-radius:16px;box-shadow:var(--shs);padding:12px 15px;font-size:13px;font-weight:800}
.tab.mute{opacity:.42}
.tab.mute[aria-selected="true"]{opacity:1}

/* breakdown page */
.tile.lead{border-width:var(--bd);box-shadow:var(--sh)}
.tile.lead .k{font-size:31px}
.tile.flag{background:var(--marker)}
.cat .eyebrow{display:block;margin-top:12px;font-family:"Rubik";font-weight:800;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;opacity:.5}
.cat h4{margin-top:3px}
.pct{font-family:"Rubik";font-weight:900;font-size:12px;background:rgba(255,255,255,.75);
  border:3px solid var(--ink);border-radius:99px;padding:3px 9px}

.switch{display:grid;grid-template-columns:1fr 1fr;border:var(--bd) solid var(--ink);
  border-radius:20px;box-shadow:var(--sh);overflow:hidden;background:var(--white)}
.switch button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;
  border:0;border-inline-start:var(--bd) solid var(--ink);padding:13px 20px;background:transparent;
  transition:background .13s;opacity:.5}
.switch button:first-child{border-inline-start:0}
.switch button:hover{opacity:.8;background:var(--lime)}
.switch button.on{opacity:1;background:var(--marker)}
.sl{display:flex;align-items:center;gap:8px;font-family:"Rubik";font-weight:800;font-size:13px;letter-spacing:.03em}
.rad{width:15px;height:15px;flex:none;border:3px solid var(--ink);border-radius:50%;background:var(--white)}
.switch button.on .rad{background:var(--ink);box-shadow:inset 0 0 0 2.5px var(--white)}
.sn{display:flex;align-items:baseline;gap:4px;font-family:"Rubik";font-weight:900;font-size:29px;
  line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.sn .cur{font-size:.42em;font-weight:800;opacity:.55}
.smeta{font-size:11.5px;font-weight:700;opacity:.65;line-height:1.35}
.side{display:none}
.side.on{display:grid;gap:16px}
@media (max-width:640px){.switch{grid-template-columns:1fr}}

.sect{padding:0;overflow:hidden}
.sect>.head{padding:17px 20px;border-bottom:var(--bd) solid var(--ink)}
.sect>.cats{padding:18px 20px}
.pot{display:flex;gap:22px;align-items:center;padding:20px;flex-wrap:wrap}
.pot-vis{position:relative;flex:none;width:190px;height:190px}
.donut{width:190px;height:190px;display:block}
.pot-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  pointer-events:none;font-family:"Rubik";font-weight:900}
.pot-mid .pt{font-family:"Rubik";font-weight:900;font-size:14px;line-height:1.3;opacity:.72}
.pot-mid small{font-size:10.5px;font-weight:800;opacity:.55;letter-spacing:.02em}
.pot-mid .u2{font-size:12px;opacity:.45}
.r .sw{width:15px;height:15px;flex:none;border:3px solid var(--ink);border-radius:5px}
.r.pick{width:100%;background:var(--white);border:0;border-bottom:3px dashed var(--ink);
  cursor:pointer;text-align:start;font-family:inherit;font-size:13.5px;font-weight:700;transition:background .12s}
.r.pick:hover{background:var(--lime)}
.r.pick.sel{background:var(--marker);box-shadow:inset 0 0 0 3px var(--ink)}
.r.rnote{font-size:11.5px;font-weight:700;opacity:.7;background:var(--white)}
.subhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 20px;background:var(--white);border-block:var(--bd) solid var(--ink)}
.subhead h3{font-size:16px;font-weight:900;flex:none}
.sinput.slim{width:auto;flex:1;min-width:150px;max-width:280px;padding:7px 14px;font-size:13px;background:var(--white)}
#incBody,#splitBody{padding:0}
#incBody .rows,#splitBody .rows{border:0;border-radius:0}

/* one pot, divided three ways */
.split-bar{display:flex;margin-top:14px;border:var(--bd) solid var(--ink);border-radius:14px;
  overflow:hidden;box-shadow:var(--shs);height:58px}
.sg{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;
  border-inline-start:var(--bd) solid var(--ink);min-width:0;overflow:hidden;padding:0 4px}
.sg:first-child{border-inline-start:0}
.sg b{font-family:"Rubik";font-weight:900;font-size:13px;white-space:nowrap}
.sg span{font-family:"Rubik";font-weight:800;font-size:11.5px;opacity:.65}
.split-legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:12.5px;font-weight:700}
.split-legend span{display:flex;align-items:center;gap:7px}
.split-legend i{width:13px;height:13px;border:3px solid var(--ink);border-radius:4px;flex:none}
.split-legend b{font-family:"Rubik";font-weight:900}

/* generic tiles */
.tiles{display:grid;gap:14px}
.t3{grid-template-columns:repeat(3,1fr)}
.t4{grid-template-columns:repeat(4,1fr)}
.t2{grid-template-columns:repeat(2,1fr)}
.t6{grid-template-columns:repeat(6,1fr)}
.t6 .k{font-size:24px}
.t6 .v{font-size:11.5px}
@media (max-width:1250px){.t6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.t6{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.t2{grid-template-columns:1fr}}
.tile{border:var(--bd) solid var(--ink);border-radius:18px;box-shadow:var(--shs);padding:14px 15px;background:var(--white)}
.tile .k{display:flex;align-items:baseline;gap:4px;font-family:"Rubik";font-weight:900;font-size:27px;
  line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .k .u{font-size:15px;font-weight:800;opacity:.48}
.tile .v{font-size:12px;font-weight:800;opacity:.72;margin-top:4px;line-height:1.35}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

/* chart */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end}
.mon{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:none;border:0;padding:0}
.pair{display:flex;gap:5px;align-items:flex-end;height:184px}
.bar{width:26px;border:3px solid var(--ink);border-radius:8px 8px 0 0;box-shadow:-3px 3px 0 var(--ink);
  transition:transform .14s;overflow:hidden;display:flex;flex-direction:column}
.bar .one{width:100%;border-bottom:3px solid var(--ink);flex:none}
.mon:hover .bar{transform:translateY(-4px)}
.bar.inc{background:var(--white)}.bar.exp{background:var(--pink)}
.mon .ml{font-family:"Rubik";font-weight:900;font-size:13px}
.mon .mv{display:flex;align-items:center;gap:5px;font-family:"Rubik";font-weight:800;font-size:11.5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mon .mv i{width:9px;height:9px;flex:none;border:2px solid var(--ink);border-radius:3px}
.mon .nt{font-family:"Rubik";font-weight:800;font-size:11px;padding:2px 8px;border:2.5px solid var(--ink);border-radius:99px}
.nt.d{background:var(--pink)}.nt.u{background:var(--mint)}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-family:"Rubik";font-weight:800;font-size:11.5px}
.legend i{width:13px;height:13px;border:3px solid var(--ink);border-radius:4px;display:inline-block;margin-inline-end:5px;vertical-align:-2px}

/* segmented */
input.sinput{width:100%;border:var(--bd) solid var(--ink);border-radius:99px;background:var(--lemon);
  padding:9px 16px;font-family:"Heebo";font-size:14px;font-weight:600;outline:none;box-shadow:var(--shs)}
input.sinput::placeholder{color:#0a0a0a;opacity:.45}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{font-family:"Rubik";font-weight:800;font-size:13px;border:3px solid var(--ink);border-radius:99px;
  padding:6px 14px;background:var(--white);box-shadow:-3px 3px 0 var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--lime)}

/* list rows */
.rows{border:var(--bd) solid var(--ink);border-radius:18px;background:var(--white);overflow:hidden}
.r{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:3px dashed var(--ink);font-size:13.5px;font-weight:700}
.r:last-child{border-bottom:0}
.r .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .mt{font-size:11px;font-weight:700;opacity:.55;white-space:nowrap}
.r .am{font-family:"Rubik";font-weight:900;font-size:14.5px;white-space:nowrap}
.r.gp{cursor:pointer;font-family:"Rubik";font-weight:900;font-size:15px;
  border-bottom:var(--bd) solid var(--ink)}
.r.gp .car{opacity:.55}
.r.gp.open{box-shadow:inset 0 0 0 3px var(--ink)}
.r.gp.open .car{opacity:1}
.r.gp .car{transition:transform .18s;font-size:12px}
.r.gp.open .car{transform:rotate(90deg)}
.r.sb{padding-inline-start:20px;padding-inline-end:34px;background:var(--white)}
.r .mt{flex:none}
.gbar{display:flex;height:26px;margin:12px 20px;border:3px solid var(--ink);border-radius:9px;overflow:hidden}
.gbar span{border-inline-start:3px solid var(--ink);min-width:2px}
.gbar span:first-child{border-inline-start:0}
.pc{flex:none;width:34px;text-align:end;font-family:"Rubik";font-weight:800;font-size:11.5px;opacity:.6}
.r .am{flex:none;min-width:92px;text-align:end}
.mini-bar{height:9px;width:70px;border:2.5px solid var(--ink);border-radius:99px;background:var(--white);overflow:hidden;flex:none}
.mini-bar i{display:block;height:100%;background:var(--ink)}

/* ledger */
.led{display:grid;grid-template-columns:1fr;gap:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:"Rubik";font-weight:800;font-size:11.5px;
  border:3px solid var(--ink);border-radius:99px;padding:4px 6px 4px 11px;background:var(--marker);
  box-shadow:-2px 2px 0 var(--ink);cursor:pointer}
.chip i{font-style:normal;width:16px;height:16px;border:2.5px solid var(--ink);border-radius:50%;display:grid;
  place-items:center;font-size:10px;background:var(--white)}
.item{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:3px dashed var(--ink)}
.item:last-child{border-bottom:0}
.dot{width:34px;height:34px;flex:none;border:3px solid var(--ink);border-radius:11px;display:grid;place-items:center;
  box-shadow:-2px 2px 0 var(--ink)}
.item .txt{flex:1;min-width:0}
.item .t1{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:10.5px;font-weight:700;opacity:.58;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-family:"Rubik";font-weight:900;font-size:12.5px;border:3px solid var(--ink);border-radius:99px;
  padding:3px 9px;box-shadow:-2px 2px 0 var(--ink);white-space:nowrap;background:var(--white)}
.badge.in{background:var(--mint)}.badge.out{background:var(--lemon)}.badge.big{background:var(--pink)}
.btn{font-family:"Rubik";font-weight:900;font-size:12.5px;border:3px solid var(--ink);border-radius:99px;
  padding:6px 13px;background:var(--white);box-shadow:-3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s}
.btn:hover{transform:translate(2px,-2px)}
.bar-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  font-family:"Rubik";font-weight:900;font-size:14px}
.empty{padding:28px;text-align:center;font-weight:800;font-size:13.5px;opacity:.7}
.more{width:100%;margin-top:10px}

/* cat cards */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat{border:var(--bd) solid var(--ink);border-radius:20px;box-shadow:var(--sh);padding:15px;cursor:pointer;
  text-align:start;transition:transform .14s,box-shadow .14s}
.cat:hover{transform:translate(3px,-3px);box-shadow:-11px 11px 0 var(--ink)}
.cat.sel{outline:6px solid var(--ink);outline-offset:5px}
.cat .icon{width:48px;height:48px;background:var(--white);border:3.5px solid var(--ink);border-radius:14px;
  display:grid;place-items:center;box-shadow:-3px 3px 0 var(--ink)}
.cat h4{font-size:14.5px;font-weight:900;margin-top:12px}
.cat .amt{font-family:"Rubik";font-weight:900;font-size:23px;margin-top:5px}
.cat .mta{font-size:11px;font-weight:700;opacity:.62;margin-top:4px}

/* forecast */
.fc{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.fm{border:var(--bd) solid var(--ink);border-radius:18px;background:var(--white);padding:13px 14px;
  box-shadow:var(--shs);position:relative}
.fm.hl2{background:var(--lemon)}
.fm h5{font-size:15px;font-weight:900;margin-bottom:8px}
.fl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:2px 0}
.fl b{font-family:"Rubik";font-weight:900}
.fnet{margin-top:8px;border-top:3px dashed var(--ink);padding-top:7px;display:flex;justify-content:space-between;align-items:center}
.fnet span{font-size:11px;font-weight:800;opacity:.65}
.fnet b{font-family:"Rubik";font-weight:900;font-size:17px}
.fbadge{position:absolute;top:-12px;inset-inline-start:11px;font-family:"Rubik";font-weight:900;font-size:10.5px;
  background:var(--pink);border:3px solid var(--ink);border-radius:99px;padding:2px 9px;box-shadow:-2px 2px 0 var(--ink)}

.alert{background:var(--marker);border:var(--bd) solid var(--ink);border-radius:16px;padding:12px 14px;
  box-shadow:var(--shs);font-size:13.5px;font-weight:800;display:flex;gap:10px;align-items:center}
.alert .i{margin-inline-start:auto}

/* ---------- info popover (hover) ---------- */
const pop=document.createElement('div');
pop.className='pop'; pop.setAttribute('role','tooltip');
const popH=document.createElement('h4'), popL=document.createElement('div'), popB=document.createElement('div');
popL.className='plead'; popB.className='pb'; pop.append(popH,popL,popB); document.body.appendChild(pop);

let showT,hideT,pinned=null;
function showPop(btn){
  const x=INFO[btn.dataset.info]; if(!x) return;
  popH.textContent=x[0];
  if(x.length>2){popL.textContent=x[1];popL.style.display='block';popB.textContent=x[2];}
  else{popL.style.display='none';popB.textContent=x[1];}
  pop.classList.add('on');
  if(window.matchMedia('(hover:none)').matches) return;
  pop.style.top='0px'; pop.style.left='0px';
  const r=btn.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight, pad=12;
  let left=r.left+r.width/2-pw/2;
  left=Math.max(pad,Math.min(left,innerWidth-pw-pad));
  let top=r.bottom+10;
  if(top+ph>innerHeight-pad) top=Math.max(pad,r.top-ph-10);
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
const hidePop=()=>{pop.classList.remove('on');pinned=null};
const queueHide=()=>{clearTimeout(showT);clearTimeout(hideT);hideT=setTimeout(hidePop,200)};

document.addEventListener('pointerover',e=>{
  const b=e.target.closest('[data-info]');
  if(!b){ if(!e.target.closest('.pop')) queueHide(); return; }
  clearTimeout(hideT); clearTimeout(showT);
  showT=setTimeout(()=>showPop(b),70);
});
pop.addEventListener('pointerenter',()=>clearTimeout(hideT));
pop.addEventListener('pointerleave',queueHide);
document.addEventListener('focusin',e=>{
  const b=e.target.closest('[data-info]');
  if(b){clearTimeout(hideT);showPop(b)} else if(!e.target.closest('.pop')) hidePop();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-info]');
  if(b){ e.preventDefault(); e.stopPropagation();
    if(pinned===b) hidePop(); else {pinned=b; clearTimeout(hideT); showPop(b);} return; }
  if(!e.target.closest('.pop')) hidePop();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePop()});
addEventListener('scroll',()=>{if(!pinned)hidePop()},{passive:true});

    const f=(pos,one)=>r.reduce((a,x)=>((x[2]>0)===pos&&!!x[9]===one)?a+Math.abs(x[2]):a,0);
    return {k,l:ML[i],ir:f(true,false),io:f(true,true),er:f(false,false),eo:f(false,true)};});
  const recNet=mon.reduce((a,m)=>a+m.ir-m.er,0);
  const oneNet=mon.reduce((a,m)=>a+m.io-m.eo,0);
  return {t,inc,exp,net:inc-exp,mon,recNet,oneNet,n:t.length};
}

function outData(acc){

    g.a-=x[2]; g.t++;
    let b=g.br.get(x[6]); if(!b){b={n:x[6],a:0,t:0};g.br.set(x[6],b)}
    b.a-=x[2]; b.t++;
  });
  const groups=[...gm.values()].map(g=>({...g,br:[...g.br.values()].sort((p,q)=>q.a-p.a)}))
    .sort((p,q)=>q.a-p.a);
  const vm=new Map();
  t.forEach(x=>{let v=vm.get(x[1]); if(!v){v={n:x[1],g:x[5],b:x[6],a:0,t:0};vm.set(x[1],v)} v.a-=x[2]; v.t++;});
  const vendors=[...vm.values()].sort((p,q)=>q.a-p.a);
  const total=t.reduce((a,x)=>a-x[2],0);
  return {groups,vendors,total,n:t.length};
}
function inData(acc){
  const t=TX.filter(x=>x[2]>0&&(!acc||x[4]===acc));

    v.a+=x[2]; v.t++;});
  INC.forEach(i=>{const v=sm.get(i[0]); if(v)v.e=i[2];});
  const src=[...sm.values()].sort((p,q)=>q.a-p.a);

  src.forEach(v=>{by[v.e].a+=v.a;by[v.e].t+=v.t;by[v.e].s++;});
  const total=t.reduce((a,x)=>a+x[2],0);
  return {src,by,total,n:t.length};
}

function donut(by,total){
  const R=66,C=2*Math.PI*R,GAP=7;let off=0;
  const seg=[['פינחס','--blue'],['גיטי','--pink'],['משק בית','--mint']]
    .map(([e,c])=>[total?by[e].a/total*100:0,c]).filter(x=>x[0]>0);
  return `<svg viewBox="0 0 190 190" class="donut" role="img" aria-label="חלוקת ההכנסות לפי מרוויח">
    <circle cx="95" cy="95" r="${R}" fill="none" stroke="#0a0a0a" stroke-width="36"/>
    ${seg.map(([p,c])=>{const len=C*p/100;
      const d=`<circle cx="95" cy="95" r="${R}" fill="none" stroke="var(${c})" stroke-width="28"
        stroke-dasharray="${Math.max(len-GAP,1)} ${C-Math.max(len-GAP,1)}"
        stroke-dashoffset="${-off}" transform="rotate(-90 95 95)"/>`;
      off+=len;return d;}).join('')}
    <circle cx="95" cy="95" r="52" fill="var(--white)" stroke="#0a0a0a" stroke-width="4"/></svg>`;
}

      const open=q?'open':'', src=q?brs:g.br, tot=src.reduce((a,x)=>a+x.a,0)||1;
      return `<div class="r gp ${open}" data-g="${gi}" style="background:var(${GC[g.n]||'--white'})">

function drawInc(){
